<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@rivocode/ui: the RivoCode design system</title>
    <meta
      name="description"
      content="Documentation for @rivocode/ui: 134 components on top of Base UI, tokens in three layers, two themes and two densities. Every page has raw markdown for agents to read."
    />
    <meta name="theme-color" content="#0f1113" />
    <!--
      The PNG goes along with the SVG because SVG favicon support is uneven:
      without it the search result falls back to the generic globe. These are
      the same files as the landing page, so the brand does not drift between
      the two sites.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
