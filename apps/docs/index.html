<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@rivocode/ui: design system da RivoCode</title>
    <meta
      name="description"
      content="Documentacao do @rivocode/ui: 91 componentes sobre a Base UI, tokens em tres camadas, dois temas e duas densidades. Cada pagina tem markdown cru para leitura por agent."
    />
    <meta name="theme-color" content="#0f1113" />
    <!--
      O PNG acompanha o SVG porque o suporte a favicon em SVG e irregular: sem
      ele o resultado de busca cai no globo generico. Sao os mesmos arquivos da
      landing, para a marca nao divergir entre os dois sites.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
