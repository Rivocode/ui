<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@rivocode/ui on a phone</title>
    <style>
      /* Chrome on macOS does not open a window below 500px, so the phone width
         comes from an iframe, not from the window size. Without this the
         portrait comes out cropped at 390 but with a 500 layout, and lies. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #4a4a4a;
      }
      iframe {
        width: 390px;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="stage" title="Showcase at phone width"></iframe>
    <script>
      document.getElementById("stage").src = location.hash.slice(1) || "./index.html";
    </script>
  </body>
</html>
