<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>@rivocode/ui no celular</title>
    <style>
      /* O Chrome no macOS nao abre janela abaixo de 500px, entao a largura de
         celular vem de um iframe, e nao do tamanho da janela. Sem isto o
         retrato sai cortado em 390 mas com layout de 500, e mente. */
      html, body { margin: 0; height: 100%; background: #4a4a4a; }
      iframe { width: 390px; height: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <iframe id="tela" title="Vitrine em largura de celular"></iframe>
    <script>
      document.getElementById("tela").src = location.hash.slice(1) || "./index.html";
    </script>
  </body>
</html>
