<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Section portrait</title>
    <style>
      /* The magenta is the frame, not decoration: the capture comes out at the
         window size, so the script is what crops, trimming the leftover
         borders in this color. No house theme produces it. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ff00ff;
      }
      #frame {
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        top: 0;
        left: 0;
        border: 0;
        display: block;
      }
      pre {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 16px;
        background: #101010;
        color: #ffffff;
        font: 14px monospace;
      }
    </style>
  </head>
  <body>
    <div id="frame"><iframe id="stage" title="Showcase section"></iframe></div>
    <script>
      const PAD = 8;
      document.documentElement.dataset.rcReady = "0";
      const [page, name, theme, density] = decodeURIComponent(location.hash.slice(1)).split("|");

      const frame = document.getElementById("frame");
      const stage = document.getElementById("stage");
      stage.style.width = "1240px";
      stage.style.height = "2000px";
      stage.src = page || "./index.html";

      let scope = "";
      if (theme) scope += '[data-rc-theme="' + theme + '"]';
      if (density) scope += '[data-rc-density="' + density + '"]';
      const query = (scope ? scope + " " : "") + '[data-rc-shot="' + name + '"]';

      function fail(message) {
        const pre = document.createElement("pre");
        pre.textContent = message;
        document.body.append(pre);
      }

      let tries = 0;
      const timer = setInterval(() => {
        const doc = stage.contentDocument;
        const target = doc && doc.querySelector(query);
        if (!target) {
          if (++tries > 60) {
            clearInterval(timer);
            fail("section not found in " + page + "\n" + query);
            document.documentElement.dataset.rcReady = "1";
          }
          return;
        }

        clearInterval(timer);
        const place = () => {
          stage.style.height = doc.documentElement.scrollHeight + "px";
          const box = target.getBoundingClientRect();
          const left = Math.max(0, Math.floor(box.left + doc.documentElement.scrollLeft) - PAD);
          const top = Math.max(0, Math.floor(box.top + doc.documentElement.scrollTop) - PAD);
          frame.style.width = Math.ceil(box.width) + PAD * 2 + "px";
          frame.style.height = Math.ceil(box.height) + PAD * 2 + "px";
          stage.style.left = -left + "px";
          stage.style.top = -top + "px";
        };

        doc.fonts.ready.then(() => {
          place();
          new ResizeObserver(place).observe(target);
          new ResizeObserver(place).observe(doc.documentElement);
          document.documentElement.dataset.rcReady = "1";
        });
      }, 50);
    </script>
  </body>
</html>
