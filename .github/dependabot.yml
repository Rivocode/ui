version: 2

# What proves an update breaks nothing is `ci.yml`, which runs the whole gate
# on every PR. Minor and patch arrive in a single PR per folder; a major arrives
# on its own, because it is a decision and not routine.
#
# `native/` is left out on purpose: it is not a workspace, and installing there
# creates a second React (`check:install`). The versions the native package is
# tested against live in `examples/native`.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
    groups:
      web:
        update-types: ["minor", "patch"]
    # The site has to use the SAME React as the root: the blocks test mounts
    # `apps/docs/src/blocks` together with the suite, and two copies bring the
    # hook down with "Invalid hook call". The root stays on the React that the
    # Expo SDK pins in `examples/native`, so the native suite tests the React
    # the app runs. React moves together with the SDK upgrade, done by a person,
    # in both folders.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The Expo SDK pins React, React Native and the native modules. Bumping one
  # of them outside the SDK breaks the app, so only patches come in here; an
  # SDK upgrade is `npx expo install --fix`, done by a person.
  - package-ecosystem: "bun"
    directory: "/examples/native"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
    groups:
      native:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
