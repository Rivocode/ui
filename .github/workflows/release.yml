name: release

# Publica no npm quando uma tag `v*` sobe.
#
# A tag e o gatilho, e nao um clique: assim o que foi publicado tem sempre um
# ponto no historico com o mesmo nome, e da para voltar e ver exatamente que
# codigo virou aquela versao.
on:
  push:
    tags: ["v*"]
  # Permite repetir uma publicacao que falhou no meio, sem criar outra tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ja existente para publicar, como v0.4.0"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sem `id-token`, porque sem `--provenance`: o registro recusa assinatura
      # vinda de repositorio privado, com 422 e a mensagem "Only public source
      # repositories are supported when publishing with provenance". A checagem
      # do CLI nao pega isso - ela olha a visibilidade do PACOTE, e e pulada
      # quando se passa `--access public`. Quem decide e o servidor, depois de
      # todo o trabalho feito e da assinatura ja registrada no log publico.
      #
      # Para reativar, o repositorio precisa ser publico. Enquanto for privado,
      # devolver o `--provenance` so recria a falha no ultimo passo.

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # O Node entra so para o `npm publish`: o bun nao escreve o .npmrc a
      # partir do segredo, e e esse arquivo que autentica no registro.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # O segredo e conferido ANTES de tudo, e nao no ultimo passo.
      #
      # Sem isto, a falta dele so aparece depois do install, do check, do build
      # e do empacotamento - o `npm publish` morre com ENEEDAUTH e a unica
      # coisa que restou do gasto e uma tag ja publicada no historico apontando
      # para uma versao que nunca subiu.
      #
      # Duas causas comuns, e a segunda nao se parece com um problema de
      # segredo: o NPM_TOKEN nao existe no repositorio; ou ele existe como
      # segredo da ORGANIZACAO, e repositorio privado em plano gratuito nao
      # enxerga segredo de organizacao. Nos dois casos o valor chega vazio.
      - name: Conferir o segredo do npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "O segredo NPM_TOKEN chegou vazio."
            echo
            echo "Confira em Settings > Secrets and variables > Actions:"
            echo "  - ele existe como segredo do REPOSITORIO (e nao so da organizacao)?"
            echo "  - repositorio privado em plano gratuito nao le segredo de organizacao."
            echo
            echo "Depois de corrigir, republique sem criar tag nova:"
            echo "  Actions > este workflow > Run workflow, com a tag existente."
            exit 1
          fi
          echo "Segredo presente."

      # A tag e a versao do package.json precisam contar a mesma historia. Sem
      # esta conferencia, `git tag v0.4.0` sobre um package.json em 0.3.0
      # republica silenciosamente a versao velha, ou falha la na frente com um
      # erro que nao explica nada.
      - name: Conferir se a tag bate com a versao
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "A tag $tag nao bate com a versao do package.json ($pkg)."
            exit 1
          fi
          echo "Publicando $pkg"

      # A tag pode bater com o package.json e a versao ainda assim ja estar no
      # registro - basta o numero ter subido a mao antes. O npm so conta isso
      # no ultimo passo, e ai o gasto ja aconteceu todo.
      #
      # Foi exatamente assim que o release-native falhou quatro vezes seguidas:
      # cada tentativa atravessava install, tipos, testes e empacotamento para
      # morrer no publish com `403 ... You cannot publish over the previously
      # published versions` - uma mensagem que fala de permissao e nao diz o
      # que fazer. Aqui o gasto e maior ainda: o `bun run check` deste pacote
      # roda dezesseis verificacoes antes de chegar ao build.
      - name: Conferir se a versao ja esta publicada
        # O .npmrc que o setup-node escreveu espera esta variavel. Consultar o
        # registro nao exige credencial, mas com ela ausente o npm le um token
        # vazio no proprio arquivo de configuracao, e a falha que aparece fala
        # de autenticacao em vez de falar da versao.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          versao=$(node -p "require('./package.json').version")

          # `npm view` responde 404 tanto para versao inexistente quanto para
          # pacote inexistente, e os dois casos querem dizer a mesma coisa
          # aqui: pode publicar. Por isso o erro vira string vazia em vez de
          # parar o passo.
          publicada=$(npm view "@rivocode/ui@$versao" version 2>/dev/null || true)

          if [ -n "$publicada" ]; then
            echo "A tag foi criada para a versao $versao, que ja esta publicada no npm."
            echo
            echo "O registro nao aceita republicar o mesmo numero - nem com outro"
            echo "conteudo, nem depois de um unpublish. Publicar de novo exige"
            echo "uma versao nova."
            echo
            echo "O que fazer:"
            echo "  1. suba a versao em package.json e registre a mudanca em"
            echo "     CHANGELOG.md;"
            echo "  2. apague a tag que sobrou, aqui e no remoto:"
            echo "     git tag -d v$versao && git push origin :v$versao"
            echo "  3. crie a tag da versao nova, que e quem dispara este workflow."
            echo
            echo "No registro hoje: latest $(npm view @rivocode/ui version 2>/dev/null || echo '?')."
            exit 1
          fi

          echo "A versao $versao ainda nao existe no registro."

      - run: bun run check
      - run: bun run build

      # O tarball precisa levar o CLI: `bin` sem o arquivo publicado passa como
      # aviso, e nao como erro, entao a versao sobe quebrada e so descobrimos
      # quando alguem roda o comando. Ja aconteceu aqui uma vez.
      - name: Conferir o que vai no pacote
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const [meta] = require('/tmp/pack.json');
            const files = meta.files.map((file) => file.path);
            const bin = require('./package.json').bin ?? {};
            for (const target of Object.values(bin)) {
              const path = target.replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Falta no tarball o bin ' + path);
                process.exit(1);
              }
            }
            console.log('bin ok:', Object.keys(bin).join(', ') || 'nenhum');
          "

      # O ensaio, antes da estreia.
      #
      # O passo acima confere a LISTA de arquivos; este exercita o caminho da
      # publicacao inteiro - o mesmo empacotamento, as mesmas regras de
      # `files`, o mesmo `--access public` - e para antes do unico passo que
      # nao da para desfazer. Os dois nao sao o mesmo passo: um le o tarball,
      # o outro monta a publicacao.
      #
      # Vale mesmo com o publish real logo em seguida: uma quebra de
      # empacotamento aparece aqui, com a publicacao ainda por fazer, e nao
      # com metade da versao ja no registro.
      #
      # O `--ignore-scripts` acompanha o passo seguinte pela mesma razao dele,
      # e por mais uma: sem ele o ensaio dispararia o `prepublishOnly` - check
      # e build de novo - e o ensaio custaria mais que a estreia.
      - name: Ensaiar a publicacao
        run: npm publish --access public --ignore-scripts --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `--ignore-scripts` porque o `prepublishOnly` roda check e build de novo,
      # e os dois ja passaram acima. Sem isto a publicacao gasta o dobro do
      # tempo repetindo o que acabou de ser feito.
      - name: Publicar
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
