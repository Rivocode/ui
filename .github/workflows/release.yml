name: release

# Publishes to npm when a `v*` tag goes up.
#
# The tag is the trigger, not a click: this way what was published always has
# a point in the history with the same name, and you can go back and see
# exactly which code became that version.
on:
  push:
    tags: ["v*"]
  # Allows repeating a publication that failed halfway, without creating another tag.
  workflow_dispatch:
    inputs:
      tag:
        # It stopped being required because of the dry run: a dry run wants to
        # run what is on main now, not what a tag froze. To publish for real it
        # is still required - the check is in the step "Check that the tag
        # matches the version", and not here, because the form cannot make one
        # field conditional on another.
        description: "Existing tag to publish, such as v0.9.0. Empty only in a dry run."
        required: false
      dry_run:
        # The native side got a dry run after four runs and four failures, all
        # on the last step. This workflow never had one, and was exposed to the
        # same loop: the only way to find out whether the path works was to
        # create a new version tag - burning a number to run a test.
        #
        # Everything runs the same, in the same order, with the same secrets and
        # the same `--dry-run` the first release already did. Only the real
        # `npm publish` is left out, and the two guards that exist to protect a
        # version number report instead of stopping, because in a dry run there
        # is no number to protect.
        description: "Dry run: runs the whole path and does NOT publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token` and `--provenance` go TOGETHER: one without the other does
      # not publish signed, and the gap only shows on the last command of a
      # publication that cannot be undone.
      #
      # Both were off while the repository was private, because the registry
      # refuses provenance from a private source with 422 and the message
      # "Only public source repositories are supported when publishing with
      # provenance". The CLI's check does not catch it: it looks at the
      # PACKAGE's visibility, and is skipped when `--access public` is passed.
      # The server decides, after all the work is done.
      #
      # The repository has been public since 27/08/2026. If it goes private
      # again, the line that goes is the `--provenance` in the publish step,
      # and this one goes with it.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is here only for `npm publish`, which authenticates through
      # trusted publishing and not through .npmrc: without `registry-url`, no
      # token is written.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Trusted publishing (OIDC): npm trusts this workflow, from this
      # repository, and no token is stored. It requires npm 11.5.1 or newer,
      # and the npm that ships with Node may be older. Without it, `npm publish`
      # falls back to the token that no longer exists and dies with ENEEDAUTH
      # after check and build have already spent the run.
      - name: Check the npm for trusted publishing
        run: |
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm $version"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$version"; then
            echo "::error::Trusted publishing requires npm 11.5.1 or newer, and this one is $version."
            exit 1
          fi

      # The tag and the package.json version have to tell the same story.
      # Without this check, `git tag v0.4.0` over a package.json at 0.3.0
      # silently republishes the old version, or fails further on with an error
      # that explains nothing.
      - name: Check the provenance token
        # npm's `--dry-run` does NOT exercise provenance: there is an
        # `if (!dryRun)` before the signature is generated, so the dry run goes
        # green without proving anything. A missing permission would only show
        # on the last command of a publication that cannot be undone, and that
        # is how 0.8.0 went out unsigned with the whole workflow green.
        #
        # This variable only exists when `id-token: write` was granted to the
        # job. It costs no network, and it is the only part of provenance that
        # can be proven before spending the tag.
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token: the job needs id-token write in permissions."
            exit 1
          fi
          echo "OIDC token present: the publication goes out signed."

      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.event.inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"

          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$TAG" ] && [ "$TAG" != "$pkg" ]; then
              echo "Warning: tag $TAG does not match package.json ($pkg)."
              echo "In a real publication this would stop here."
            else
              echo "Dry run over $pkg."
            fi
            exit 0
          fi

          # Outside a dry run the tag is required, and the form cannot demand
          # it only when `dry_run` is unchecked. Without this line, a careless
          # trigger would publish whatever was on main.
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "A real publication requires the tag in the form."
            echo "To just exercise the path, check the \"Dry run\" box."
            exit 1
          fi

          tag="${TAG:-${{ github.ref_name }}}"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match the package.json version ($pkg)."
            exit 1
          fi
          echo "Publishing $pkg"

      # The tag may match package.json and the version still be in the
      # registry already - it is enough for the number to have been bumped by
      # hand before. npm only says so on the last step, and by then the whole
      # cost has been paid.
      #
      # That is exactly how release-native failed four times in a row: each
      # attempt went through install, types, tests and packaging only to die on
      # publish with `403 ... You cannot publish over the previously published
      # versions` - a message that talks about permission and does not say what
      # to do. Here the cost is even higher: this package's `bun run check`
      # runs sixteen checks before reaching the build.
      - name: Check whether the version is already published
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(node -p "require('./package.json').version")

          # `npm view` answers 404 both for a missing version and for a missing
          # package, and both cases mean the same thing here: go ahead and
          # publish. That is why the error becomes an empty string instead of
          # stopping the step.
          published=$(npm view "@rivocode/ui@$version" version 2>/dev/null || true)

          # In a dry run, this guard becomes the opposite of itself.
          #
          # It exists so as not to spend the whole run when the number was
          # already used. The dry run wants exactly to spend the whole run, and
          # the version it has at hand is almost always one already published.
          # Stopping here would bring the problem back: exercising the path
          # would need a new number, which is the version the dry run exists
          # not to burn.
          if [ -n "$published" ] && [ "$DRY_RUN" = "true" ]; then
            echo "Version $version is already in the registry."
            echo "In a real release this would stop here; in a dry run, it goes on."
            exit 0
          fi

          if [ -n "$published" ]; then
            echo "The tag was created for version $version, which is already published on npm."
            echo
            echo "The registry does not accept republishing the same number - not with"
            echo "different content, not after an unpublish. Publishing again requires"
            echo "a new version."
            echo
            echo "What to do:"
            echo "  1. bump the version in package.json and record the change in"
            echo "     CHANGELOG.md;"
            echo "  2. delete the leftover tag, here and on the remote:"
            echo "     git tag -d v$version && git push origin :v$version"
            echo "  3. create the tag for the new version, which is what triggers this workflow."
            echo
            echo "In the registry today: latest $(npm view @rivocode/ui version 2>/dev/null || echo '?')."
            exit 1
          fi

          echo "Version $version does not exist in the registry yet."

      - run: bun run check
      - run: bun run build

      # The tarball has to carry the CLI: a `bin` without the published file
      # passes as a warning, not an error, so the version goes up broken and we
      # only find out when someone runs the command. It has happened here once.
      - name: Check what goes into the package
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const pack = require('/tmp/pack.json');
            const meta = Array.isArray(pack) ? pack[0] : Object.values(pack)[0];
            const files = meta.files.map((file) => file.path);
            const bin = require('./package.json').bin ?? {};
            for (const target of Object.values(bin)) {
              const path = target.replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Missing bin from the tarball: ' + path);
                process.exit(1);
              }
            }
            console.log('bin ok:', Object.keys(bin).join(', ') || 'none');
          "

      # The rehearsal, before the real thing.
      #
      # The step above checks the LIST of files; this one exercises the whole
      # publishing path - the same packaging, the same `files` rules, the same
      # `--access public` - and stops before the only step that cannot be
      # undone. They are not the same step: one reads the tarball, the other
      # assembles the publication.
      #
      # It is worth it even with the real publish right after: a packaging
      # break shows up here, with the publication still to be done, and not
      # with half the version already in the registry.
      #
      # `--ignore-scripts` goes along with the next step for the same reason,
      # and one more: without it the rehearsal would fire `prepublishOnly` -
      # check and build again - and the rehearsal would cost more than the
      # real thing.
      - name: Rehearse the publication
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          output=$(npm publish --access public --ignore-scripts --provenance --dry-run 2>&1)
          code=$?
          echo "$output"

          if [ $code -eq 0 ]; then
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ] &&
             echo "$output" | grep -q "cannot publish over the previously published versions"; then
            echo
            echo "The registry only refused the NUMBER: everything before it passed."
            exit 0
          fi

          exit $code

      # `--ignore-scripts` because `prepublishOnly` runs check and build again,
      # and both already passed above. Without this the publication takes twice
      # as long repeating what was just done.
      - name: Publish
        if: ${{ inputs.dry_run != true }}
        run: npm publish --access public --ignore-scripts --provenance

      - name: Say it was a dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "Dry run finished. Nothing was published."
          echo "The whole path ran over version $version of package.json."
          echo "In the registry today: latest $(npm view @rivocode/ui version 2>/dev/null || echo '?')."
