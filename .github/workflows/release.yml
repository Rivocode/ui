name: release

# Publica no npm quando uma tag `v*` sobe.
#
# A tag e o gatilho, e nao um clique: assim o que foi publicado tem sempre um
# ponto no historico com o mesmo nome, e da para voltar e ver exatamente que
# codigo virou aquela versao.
on:
  push:
    tags: ["v*"]
  # Permite repetir uma publicacao que falhou no meio, sem criar outra tag.
  workflow_dispatch:
    inputs:
      tag:
        # Deixou de ser obrigatoria por causa do ensaio: um ensaio quer rodar o
        # que esta na main agora, e nao o que uma tag congelou. Para publicar de
        # verdade ela continua exigida - a conferencia esta no passo "Conferir
        # se a tag bate com a versao", e nao aqui, porque o formulario nao sabe
        # condicionar um campo ao outro.
        description: "Tag ja existente para publicar, como v0.9.0. Vazio so em ensaio."
        required: false
      ensaio:
        # O lado nativo ganhou ensaio depois de quatro execucoes e quatro
        # falhas, todas no ultimo passo. Este workflow nunca teve, e estava
        # exposto ao mesmo laco: a unica forma de descobrir se o caminho
        # funciona era criar uma tag de versao nova - queimar um numero para
        # fazer um teste.
        #
        # Tudo roda igual, na mesma ordem, com os mesmos segredos e o mesmo
        # `--dry-run` que a estreia ja fazia. So o `npm publish` real fica de
        # fora, e as duas guardas que existem para proteger um numero de versao
        # passam a relatar em vez de parar, porque em ensaio nao ha numero a
        # proteger.
        description: "Ensaio: roda o caminho inteiro e NAO publica"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token` e `--provenance` andam JUNTOS: um sem o outro nao publica
      # assinado, e a falta so aparece no ultimo comando de uma publicacao que
      # nao se desfaz.
      #
      # Os dois estiveram desligados enquanto o repositorio era privado, porque
      # o registro recusa procedencia de fonte privada com 422 e a mensagem
      # "Only public source repositories are supported when publishing with
      # provenance". A checagem do CLI nao pega isso: ela olha a visibilidade do
      # PACOTE, e e pulada quando se passa `--access public`. Quem decide e o
      # servidor, depois de todo o trabalho feito.
      #
      # O repositorio e publico desde 27/08/2026. Se voltar a ser privado, a
      # linha que sai e o `--provenance` do passo de publicar, e esta daqui vai
      # junto.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # O Node entra so para o `npm publish`, que autentica pela publicacao
      # confiavel e nao por .npmrc: sem `registry-url`, nenhum token e escrito.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Publicacao confiavel (OIDC): o npm confia neste workflow, deste
      # repositorio, e nao existe token guardado. Ela exige npm 11.5.1 ou mais
      # novo, e o npm que vem com o Node pode ser mais velho. Sem ele, o
      # `npm publish` cai no token que nao existe mais e morre com ENEEDAUTH
      # depois de o check e o build ja terem gastado a corrida.
      - name: Conferir o npm da publicacao confiavel
        run: |
          npm install -g npm@latest
          versao=$(npm --version)
          echo "npm $versao"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$versao"; then
            echo "::error::A publicacao confiavel exige npm 11.5.1 ou mais novo, e este e o $versao."
            exit 1
          fi

      # A tag e a versao do package.json precisam contar a mesma historia. Sem
      # esta conferencia, `git tag v0.4.0` sobre um package.json em 0.3.0
      # republica silenciosamente a versao velha, ou falha la na frente com um
      # erro que nao explica nada.
      - name: Conferir o token da procedencia
        # O `--dry-run` do npm NAO exercita procedencia: ha um `if (!dryRun)`
        # antes da geracao da assinatura, entao o ensaio fica verde sem provar
        # nada. A permissao faltando so apareceria no ultimo comando de uma
        # publicacao que nao se desfaz, e foi assim que a 0.8.0 saiu sem
        # assinatura com o workflow inteiro verde.
        #
        # Esta variavel so existe quando `id-token: write` foi concedido ao job.
        # Custa zero rede, e e a unica parte da procedencia que da para provar
        # antes de gastar a tag.
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::Sem token OIDC: o job precisa de id-token write em permissions."
            exit 1
          fi
          echo "Token OIDC presente: a publicacao sai assinada."

      - name: Conferir se a tag bate com a versao
        env:
          TAG: ${{ github.event.inputs.tag }}
          ENSAIO: ${{ inputs.ensaio }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"

          if [ "$ENSAIO" = "true" ]; then
            if [ -n "$TAG" ] && [ "$TAG" != "$pkg" ]; then
              echo "Aviso: a tag $TAG nao bate com o package.json ($pkg)."
              echo "Numa publicacao de verdade isto pararia aqui."
            else
              echo "Ensaio sobre $pkg."
            fi
            exit 0
          fi

          # Fora do ensaio a tag e obrigatoria, e o formulario nao consegue
          # exigi-la so quando `ensaio` esta desmarcado. Sem esta linha, um
          # disparo distraido publicaria o que estivesse na main.
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Publicacao de verdade exige a tag no formulario."
            echo "Para so exercitar o caminho, marque a caixa \"Ensaio\"."
            exit 1
          fi

          tag="${TAG:-${{ github.ref_name }}}"
          if [ "$tag" != "$pkg" ]; then
            echo "A tag $tag nao bate com a versao do package.json ($pkg)."
            exit 1
          fi
          echo "Publicando $pkg"

      # A tag pode bater com o package.json e a versao ainda assim ja estar no
      # registro - basta o numero ter subido a mao antes. O npm so conta isso
      # no ultimo passo, e ai o gasto ja aconteceu todo.
      #
      # Foi exatamente assim que o release-native falhou quatro vezes seguidas:
      # cada tentativa atravessava install, tipos, testes e empacotamento para
      # morrer no publish com `403 ... You cannot publish over the previously
      # published versions` - uma mensagem que fala de permissao e nao diz o
      # que fazer. Aqui o gasto e maior ainda: o `bun run check` deste pacote
      # roda dezesseis verificacoes antes de chegar ao build.
      - name: Conferir se a versao ja esta publicada
        env:
          ENSAIO: ${{ inputs.ensaio }}
        run: |
          versao=$(node -p "require('./package.json').version")

          # `npm view` responde 404 tanto para versao inexistente quanto para
          # pacote inexistente, e os dois casos querem dizer a mesma coisa
          # aqui: pode publicar. Por isso o erro vira string vazia em vez de
          # parar o passo.
          publicada=$(npm view "@rivocode/ui@$versao" version 2>/dev/null || true)

          # Em ensaio, esta guarda vira o contrario de si mesma.
          #
          # Ela existe para nao gastar a corrida inteira quando o numero ja foi
          # usado. O ensaio quer justamente gastar a corrida inteira, e a versao
          # que ele tem a mao e quase sempre uma ja publicada. Parar aqui
          # devolveria o problema: para exercitar o caminho seria preciso um
          # numero novo, que e a versao que o ensaio existe para nao queimar.
          if [ -n "$publicada" ] && [ "$ENSAIO" = "true" ]; then
            echo "A versao $versao ja esta no registro."
            echo "Num lancamento de verdade isto pararia aqui; em ensaio, segue."
            exit 0
          fi

          if [ -n "$publicada" ]; then
            echo "A tag foi criada para a versao $versao, que ja esta publicada no npm."
            echo
            echo "O registro nao aceita republicar o mesmo numero - nem com outro"
            echo "conteudo, nem depois de um unpublish. Publicar de novo exige"
            echo "uma versao nova."
            echo
            echo "O que fazer:"
            echo "  1. suba a versao em package.json e registre a mudanca em"
            echo "     CHANGELOG.md;"
            echo "  2. apague a tag que sobrou, aqui e no remoto:"
            echo "     git tag -d v$versao && git push origin :v$versao"
            echo "  3. crie a tag da versao nova, que e quem dispara este workflow."
            echo
            echo "No registro hoje: latest $(npm view @rivocode/ui version 2>/dev/null || echo '?')."
            exit 1
          fi

          echo "A versao $versao ainda nao existe no registro."

      - run: bun run check
      - run: bun run build

      # O tarball precisa levar o CLI: `bin` sem o arquivo publicado passa como
      # aviso, e nao como erro, entao a versao sobe quebrada e so descobrimos
      # quando alguem roda o comando. Ja aconteceu aqui uma vez.
      - name: Conferir o que vai no pacote
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const [meta] = require('/tmp/pack.json');
            const files = meta.files.map((file) => file.path);
            const bin = require('./package.json').bin ?? {};
            for (const target of Object.values(bin)) {
              const path = target.replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Falta no tarball o bin ' + path);
                process.exit(1);
              }
            }
            console.log('bin ok:', Object.keys(bin).join(', ') || 'nenhum');
          "

      # O ensaio, antes da estreia.
      #
      # O passo acima confere a LISTA de arquivos; este exercita o caminho da
      # publicacao inteiro - o mesmo empacotamento, as mesmas regras de
      # `files`, o mesmo `--access public` - e para antes do unico passo que
      # nao da para desfazer. Os dois nao sao o mesmo passo: um le o tarball,
      # o outro monta a publicacao.
      #
      # Vale mesmo com o publish real logo em seguida: uma quebra de
      # empacotamento aparece aqui, com a publicacao ainda por fazer, e nao
      # com metade da versao ja no registro.
      #
      # O `--ignore-scripts` acompanha o passo seguinte pela mesma razao dele,
      # e por mais uma: sem ele o ensaio dispararia o `prepublishOnly` - check
      # e build de novo - e o ensaio custaria mais que a estreia.
      - name: Ensaiar a publicacao
        run: npm publish --access public --ignore-scripts --provenance --dry-run

      # `--ignore-scripts` porque o `prepublishOnly` roda check e build de novo,
      # e os dois ja passaram acima. Sem isto a publicacao gasta o dobro do
      # tempo repetindo o que acabou de ser feito.
      - name: Publicar
        if: ${{ inputs.ensaio != true }}
        run: npm publish --access public --ignore-scripts --provenance

      - name: Dizer que foi ensaio
        if: ${{ inputs.ensaio == true }}
        run: |
          versao=$(node -p "require('./package.json').version")
          echo "Ensaio concluido. Nada foi publicado."
          echo "O caminho inteiro rodou sobre a versao $versao do package.json."
          echo "No registro hoje: latest $(npm view @rivocode/ui version 2>/dev/null || echo '?')."

