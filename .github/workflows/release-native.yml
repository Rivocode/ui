name: release-native

# Publishes @rivocode/ui-native when a `native-v*` tag goes up.
#
# Its own workflow, and not a step of the other one, because the two packages
# move at different speeds: web is at 0.5 and native at 0.2, and tying the two
# versions together would force publishing one with nothing to say about it.
#
# The tag prefix is what separates the two triggers: `v0.5.0` is web's, and
# `native-v0.2.0` is this one's. Without the prefix, a tag would publish the
# wrong package - or worse, publish the right one with the other's number.
on:
  push:
    tags: ["native-v*"]
  # Allows repeating a publication that failed halfway, without creating
  # another tag - and, with `dry_run`, going through the whole path without
  # spending any version.
  workflow_dispatch:
    inputs:
      tag:
        # It stopped being required because of the dry run: a dry run wants to
        # run what is on main now, not what a tag froze. To publish for real it
        # is still required - the check is in the step "Check the tag and the
        # version", and not here, because the form cannot make one field
        # conditional on another.
        description: "Existing tag to publish, such as native-v0.2.0. Empty only in a dry run."
        required: false
      dry_run:
        # The first release through CI is a blind flight, and always was.
        #
        # This workflow has four runs and four failures, all on the last step:
        # 0.2.0 had already been published by hand, and each attempt spent
        # install, types, tokens, parity, suite and packaging only to die on
        # `npm publish`. The full path never reached the end. And there was no
        # way to exercise it: the only way to find out whether it works was to
        # create a new version tag - burning a number to run a test.
        #
        # The dry run breaks that loop. Everything runs the same, in the same
        # order, with the same secrets and the same `--dry-run` the first
        # release does. Only the real `npm publish` is left out, and the two
        # guards that exist to protect a version number - the tag and the
        # "already published" - report instead of stopping, because in a dry
        # run there is no number to protect.
        description: "Dry run: runs the whole path and does NOT publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token` and `--provenance` go TOGETHER: one without the other does
      # not publish signed, and the gap only shows on the last command of a
      # publication that cannot be undone.
      #
      # Both were off while the repository was private, because the registry
      # refuses provenance from a private source with 422 and the message
      # "Only public source repositories are supported when publishing with
      # provenance". The CLI's check does not catch it: it looks at the
      # PACKAGE's visibility, and is skipped when `--access public` is passed.
      # The server decides, after all the work is done.
      #
      # The repository has been public since 27/08/2026. If it goes private
      # again, the line that goes is the `--provenance` in the publish step,
      # and this one goes with it.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is here only for `npm publish`, which authenticates through
      # trusted publishing and not through .npmrc: without `registry-url`, no
      # token is written.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # react and react-native are peers, and the only place in the repository
      # where they are installed is the example app - which is not a workspace.
      # Without this install `check:native:types` would have no types to check,
      # and would pass by mistake.
      - run: bun install --frozen-lockfile
        working-directory: examples/native

      # Trusted publishing (OIDC): npm trusts this workflow, from this
      # repository, and no token is stored. It requires npm 11.5.1 or newer,
      # and the npm that ships with Node may be older. Without it, `npm publish`
      # falls back to the token that no longer exists and dies with ENEEDAUTH
      # after check and build have already spent the run.
      - name: Check the npm for trusted publishing
        run: |
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm $version"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$version"; then
            echo "::error::Trusted publishing requires npm 11.5.1 or newer, and this one is $version."
            exit 1
          fi

      # The tag and the native/package.json version have to tell the same
      # story. Without this check, `git tag native-v0.3.0` over a package.json
      # at 0.2.0 silently republishes the old version.
      #
      # In a dry run the check still happens, but does not stop the run: the
      # dry run usually runs straight from main, where `ref_name` is "main" and
      # there is no tag to match. Stopping there would make the dry run die on
      # the second step - exactly what it exists to avoid.
      - name: Check the provenance token
        # npm's `--dry-run` does NOT exercise provenance: there is an
        # `if (!dryRun)` before the signature is generated, so the dry run goes
        # green without proving anything. A missing permission would only show
        # on the last command of a publication that cannot be undone - and that
        # is how 0.8.0 went out unsigned, with the whole workflow green.
        #
        # This variable only exists when `id-token: write` was granted to the
        # job. It costs no network, and it is the only part of provenance the
        # dry run catches.
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token: the job needs `id-token: write` in permissions."
            exit 1
          fi
          echo "OIDC token present: the publication goes out signed."

      - name: Check the tag and the version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          pkg="native-v$(node -p "require('./native/package.json').version")"

          if [ "$DRY_RUN" = "true" ]; then
            if [ -z "$TAG" ]; then
              echo "Dry run from ${{ github.ref_name }}, over $pkg."
            elif [ "$TAG" != "$pkg" ]; then
              echo "Warning: tag $TAG does not match native/package.json ($pkg)."
              echo "In a real publication this would stop here."
            else
              echo "Dry run over $pkg."
            fi
            exit 0
          fi

          # Outside a dry run the tag is required, and the form cannot demand
          # it only when `dry_run` is unchecked. Without this line, a careless
          # trigger would publish whatever was on main.
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "A real publication requires the tag in the form."
            echo "To just exercise the path, check the \"Dry run\" box."
            exit 1
          fi

          tag="${TAG:-${{ github.ref_name }}}"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match the native/package.json version ($pkg)."
            exit 1
          fi
          echo "Publishing $pkg"

      # The version may already be in the registry, and npm only says so at the end.
      #
      # That is how this workflow ended its first four runs: 0.2.0 had been
      # published by hand, and each attempt spent install, types, tokens,
      # parity, suite and packaging only to die on the last step with
      # `403 ... You cannot publish over the previously published versions:
      # 0.2.0` - a message that talks about permission and does not say what to
      # do. The automatic path was never exercised to the end because the only
      # thing missing was a new number.
      #
      # The native package's version lives in `native/package.json`, not at the
      # root: the two packages move at different speeds, and that is why this
      # separate workflow exists.
      - name: Check whether the version is already published
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(node -p "require('./native/package.json').version")

          # `npm view` answers 404 both for a missing version and for a missing
          # package, and both cases mean the same thing here: go ahead and
          # publish. That is why the error becomes an empty string instead of
          # stopping the step - the first publication of a new package has to
          # get through this guard.
          published=$(npm view "@rivocode/ui-native@$version" version 2>/dev/null || true)

          # In a dry run, this guard becomes the opposite of itself.
          #
          # It exists so as not to spend the whole run when the number was
          # already used. The dry run wants exactly to spend the whole run, and
          # the version it has at hand is almost always one already published -
          # that is how the first four runs died. Stopping here would bring the
          # problem back: exercising the path would need a new number, which is
          # the version the dry run exists not to burn.
          if [ -n "$published" ] && [ "$DRY_RUN" = "true" ]; then
            echo "Version $version is already in the registry."
            echo "In a real release this would stop here; in a dry run, it goes on."
            exit 0
          fi

          if [ -n "$published" ]; then
            echo "The tag was created for version $version, which is already published on npm."
            echo
            echo "The registry does not accept republishing the same number - not with"
            echo "different content, not after an unpublish. Publishing again requires"
            echo "a new version."
            echo
            echo "What to do:"
            echo "  1. bump the version in native/package.json and record the change"
            echo "     in native/CHANGELOG.md;"
            echo "  2. delete the leftover tag, here and on the remote:"
            echo "     git tag -d native-v$version && git push origin :native-v$version"
            echo "  3. create the tag for the new version, which is what triggers this workflow."
            echo
            echo "In the registry today: latest $(npm view @rivocode/ui-native version 2>/dev/null || echo '?')."
            exit 1
          fi

          echo "Version $version does not exist in the registry yet."

      # This package publishes SOURCE - `exports` points to ./src/index.ts, and
      # Metro compiles it in the consumer's app. A type error here does not stay
      # here: it shows up inside the consumer's node_modules, and their
      # skipLibCheck does not help, because it only covers .d.ts. That is why
      # the type pass is a condition for publishing, not a courtesy.
      - run: bun run check:native:types

      # The native tokens are DERIVED from the web CSS. Publishing with them out
      # of sync delivers a color no theme declares.
      - run: bun run check:native

      # The parity table is read by whoever plans a phone screen. Publishing it
      # out of date tells people to use a substitute for a piece already ported.
      - run: bun run check:parity

      - run: bun test native/

      # The tarball has to carry the CLI: a `bin` without the published file
      # passes as a warning, not an error, so the version goes up broken and we
      # only find out when someone runs the command. It has happened here once,
      # in the other package.
      - name: Check what goes into the package
        working-directory: native
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const pack = require('/tmp/pack.json');
            const meta = Array.isArray(pack) ? pack[0] : Object.values(pack)[0];
            const files = meta.files.map((file) => file.path);
            const pkg = require('./package.json');

            for (const target of Object.values(pkg.bin ?? {})) {
              const path = target.replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Missing bin from the tarball: ' + path);
                process.exit(1);
              }
            }

            // The package is the source: if the entry point does not travel,
            // the installer's app breaks on the first import, not on the build.
            for (const entry of Object.values(pkg.exports)) {
              const path = String(entry).replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Missing entry from the tarball: ' + path);
                process.exit(1);
              }
            }

            console.log('entries and bin ok:', files.length, 'files');
          "

      # The rehearsal, before the real thing.
      #
      # The step above checks the LIST of files; this one exercises the whole
      # publishing path - the same packaging, the same `files` and `exports`
      # rules, the same `--access public` - and stops before the only step that
      # cannot be undone. They are not the same step: one reads the tarball,
      # the other assembles the publication.
      #
      # It is worth it even when the publication happens right after: a
      # packaging break shows up here, with the real publish still to be done,
      # and not with half the version already in the registry.
      #
      # `--dry-run` is NOT offline, and that was the discovery that almost cost
      # the whole dry run. It builds the tarball and goes to the registry to ask
      # whether the publication would be accepted - and the first thing the
      # registry answers is that the number already exists:
      #
      #   npm error You cannot publish over the previously published versions: 0.2.0.
      #
      # That is, the dry run itself would die on the second-to-last step, on the
      # same rock that brought down the four previous runs, and for the same
      # reason: the only thing missing is a new number.
      #
      # That is why, in a dry run, this is the ONLY tolerated message. Reaching
      # it proves what the dry run came to prove - packaging closed,
      # `--access public` was understood, the registry answered and read the
      # manifest - and what is left is the refusal only a new number solves.
      # Any other failure still brings the run down, which is the point of
      # having a dry run.
      #
      # In a real publication the version is new, the command passes clean, and
      # none of this comes into play.
      - name: Rehearse the publication
        working-directory: native
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          output=$(npm publish --access public --provenance --dry-run 2>&1)
          code=$?
          echo "$output"

          if [ $code -eq 0 ]; then
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ] &&
             echo "$output" | grep -q "cannot publish over the previously published versions"; then
            echo
            echo "The registry only refused the NUMBER: everything before it passed."
            echo "In a real release the version would be new and the command would close clean."
            exit 0
          fi

          exit $code

      # The only line the dry run does not go through. Everything above already
      # ran the same.
      - name: Publish
        if: ${{ inputs.dry_run != true }}
        working-directory: native
        run: npm publish --access public --provenance

      # A dry run that ends green looks like a publication that ended green:
      # same check mark, same color, same duration. Whoever opens the run list
      # tomorrow needs to tell the two apart without going step by step - and,
      # above all, must not leave thinking the version went up. That is why the
      # note also goes to the run summary, which is the first thing the page
      # shows.
      - name: Say it was a dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          version=$(node -p "require('./native/package.json').version")
          {
            echo "## Dry run - NOTHING was published"
            echo
            echo "The whole path ran over version \`$version\`: install,"
            echo "types, tokens, parity, suite, packaging and"
            echo "\`npm publish --dry-run\`. The only step skipped was the"
            echo "real \`npm publish\`."
            echo
            echo "Still in the registry: latest \`$(npm view @rivocode/ui-native version 2>/dev/null || echo '?')\`."
            echo
            echo "To publish for real, create the tag \`native-v<version>\` -"
            echo "and the tag trigger does the rest."
          } | tee -a "$GITHUB_STEP_SUMMARY"
