name: release-native

# Publica o @rivocode/ui-native quando uma tag `native-v*` sobe.
#
# Workflow proprio, e nao um passo do outro, porque os dois pacotes andam em
# velocidades diferentes: o web esta em 0.5 e o nativo em 0.2, e amarrar as
# duas versoes obrigaria a publicar um sem ter o que dizer sobre ele.
#
# O prefixo da tag e o que separa os dois gatilhos: `v0.5.0` e do web, e
# `native-v0.2.0` e daqui. Sem o prefixo, uma tag publicaria o pacote errado -
# ou pior, publicaria o certo com o numero do outro.
on:
  push:
    tags: ["native-v*"]
  # Permite repetir uma publicacao que falhou no meio, sem criar outra tag - e,
  # com `ensaio`, atravessar o caminho inteiro sem gastar versao nenhuma.
  workflow_dispatch:
    inputs:
      tag:
        # Deixou de ser obrigatoria por causa do ensaio: um ensaio quer rodar o
        # que esta na main agora, e nao o que uma tag congelou. Para publicar de
        # verdade ela continua exigida - a conferencia esta no passo "Conferir a
        # tag e a versao", e nao aqui, porque o formulario nao sabe condicionar
        # um campo ao outro.
        description: "Tag ja existente para publicar, como native-v0.2.0. Vazio so em ensaio."
        required: false
      ensaio:
        # O primeiro lancamento por CI e um voo cego, e sempre foi.
        #
        # Este workflow tem quatro execucoes e quatro falhas, todas no ultimo
        # passo: a 0.2.0 ja estava publicada a mao, e cada tentativa gastava
        # install, tipos, tokens, paridade, suite e empacotamento para morrer no
        # `npm publish`. O caminho completo nunca chegou ao fim. E nao havia como
        # exercita-lo: a unica maneira de descobrir se ele funciona era criar uma
        # tag de versao nova - queimar um numero para fazer um teste.
        #
        # O ensaio quebra esse laco. Tudo roda igual, na mesma ordem, com os
        # mesmos segredos e o mesmo `--dry-run` que a estreia faz. So o
        # `npm publish` real fica de fora, e as duas guardas que existem para
        # proteger um numero de versao - a tag e o "ja publicada" - passam a
        # relatar em vez de parar, porque em ensaio nao ha numero a proteger.
        description: "Ensaio: roda o caminho inteiro e NAO publica"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sem `id-token`, porque sem `--provenance`: o registro recusa assinatura
      # vinda de repositorio privado, com 422 e a mensagem "Only public source
      # repositories are supported when publishing with provenance". A checagem
      # do CLI nao pega isso - ela olha a visibilidade do PACOTE, e e pulada
      # quando se passa `--access public`. Quem decide e o servidor, depois de
      # todo o trabalho feito e da assinatura ja registrada no log publico.
      #
      # Para reativar, o repositorio precisa ser publico. Enquanto for privado,
      # devolver o `--provenance` so recria a falha no ultimo passo.

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # O Node entra so para o `npm publish`: o bun nao escreve o .npmrc a
      # partir do segredo, e e esse arquivo que autentica no registro.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # react e react-native sao peers, e o unico lugar do repositorio onde
      # estao instalados e o app de exemplo - que nao e workspace. Sem esta
      # instalacao o `check:native:types` nao teria tipos para conferir, e
      # passaria por engano.
      - run: bun install --frozen-lockfile
        working-directory: examples/native

      # O segredo e conferido ANTES de tudo, e nao no ultimo passo.
      #
      # Sem isto, a falta dele so aparece depois do install, do check, do build
      # e do empacotamento - o `npm publish` morre com ENEEDAUTH e a unica
      # coisa que restou do gasto e uma tag ja publicada no historico apontando
      # para uma versao que nunca subiu.
      #
      # Duas causas comuns, e a segunda nao se parece com um problema de
      # segredo: o NPM_TOKEN nao existe no repositorio; ou ele existe como
      # segredo da ORGANIZACAO, e repositorio privado em plano gratuito nao
      # enxerga segredo de organizacao. Nos dois casos o valor chega vazio.
      - name: Conferir o segredo do npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "O segredo NPM_TOKEN chegou vazio."
            echo
            echo "Confira em Settings > Secrets and variables > Actions:"
            echo "  - ele existe como segredo do REPOSITORIO (e nao so da organizacao)?"
            echo "  - repositorio privado em plano gratuito nao le segredo de organizacao."
            echo
            echo "Depois de corrigir, republique sem criar tag nova:"
            echo "  Actions > este workflow > Run workflow, com a tag existente."
            exit 1
          fi
          echo "Segredo presente."

      # A tag e a versao do native/package.json precisam contar a mesma
      # historia. Sem esta conferencia, `git tag native-v0.3.0` sobre um
      # package.json em 0.2.0 republica silenciosamente a versao velha.
      #
      # Em ensaio a conferencia continua acontecendo, mas nao para a corrida:
      # o ensaio costuma rodar direto da main, onde `ref_name` e "main" e nao
      # ha tag nenhuma para bater. Parar ai seria fazer o ensaio morrer no
      # segundo passo - exatamente o que ele existe para evitar.
      - name: Conferir a tag e a versao
        env:
          ENSAIO: ${{ inputs.ensaio }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          pkg="native-v$(node -p "require('./native/package.json').version")"

          if [ "$ENSAIO" = "true" ]; then
            if [ -z "$TAG" ]; then
              echo "Ensaio a partir de ${{ github.ref_name }}, sobre $pkg."
            elif [ "$TAG" != "$pkg" ]; then
              echo "Aviso: a tag $TAG nao bate com o native/package.json ($pkg)."
              echo "Numa publicacao de verdade isto pararia aqui."
            else
              echo "Ensaio sobre $pkg."
            fi
            exit 0
          fi

          # Fora do ensaio a tag e obrigatoria, e o formulario nao consegue
          # exigi-la so quando `ensaio` esta desmarcado. Sem esta linha, um
          # disparo distraido publicaria o que estivesse na main.
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Publicacao de verdade exige a tag no formulario."
            echo "Para so exercitar o caminho, marque a caixa \"Ensaio\"."
            exit 1
          fi

          tag="${TAG:-${{ github.ref_name }}}"
          if [ "$tag" != "$pkg" ]; then
            echo "A tag $tag nao bate com a versao do native/package.json ($pkg)."
            exit 1
          fi
          echo "Publicando $pkg"

      # A versao pode ja estar no registro, e o npm so conta isso no fim.
      #
      # Foi assim que este workflow terminou as quatro primeiras execucoes: a
      # 0.2.0 tinha sido publicada a mao, e cada tentativa gastava install,
      # tipos, tokens, paridade, suite e empacotamento para morrer no ultimo
      # passo com `403 ... You cannot publish over the previously published
      # versions: 0.2.0` - uma mensagem que fala de permissao e nao diz o que
      # fazer. O caminho automatico nunca foi exercitado ate o fim porque a
      # unica coisa que faltava era um numero novo.
      #
      # A versao do pacote nativo mora em `native/package.json`, e nao na raiz:
      # os dois pacotes andam em velocidades diferentes, e e por isso que existe
      # este workflow separado.
      - name: Conferir se a versao ja esta publicada
        # O .npmrc que o setup-node escreveu espera esta variavel. Consultar o
        # registro nao exige credencial, mas com ela ausente o npm le um token
        # vazio no proprio arquivo de configuracao, e a falha que aparece fala
        # de autenticacao em vez de falar da versao.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENSAIO: ${{ inputs.ensaio }}
        run: |
          versao=$(node -p "require('./native/package.json').version")

          # `npm view` responde 404 tanto para versao inexistente quanto para
          # pacote inexistente, e os dois casos querem dizer a mesma coisa
          # aqui: pode publicar. Por isso o erro vira string vazia em vez de
          # parar o passo - a primeira publicacao de um pacote novo tem que
          # atravessar esta guarda.
          publicada=$(npm view "@rivocode/ui-native@$versao" version 2>/dev/null || true)

          # Em ensaio, esta guarda vira o contrario de si mesma.
          #
          # Ela existe para nao gastar a corrida inteira quando o numero ja foi
          # usado. O ensaio quer justamente gastar a corrida inteira, e a versao
          # que ele tem a mao e quase sempre uma ja publicada - foi assim que as
          # quatro primeiras execucoes morreram. Parar aqui devolveria o
          # problema: para exercitar o caminho seria preciso um numero novo, que
          # e a versao que o ensaio existe para nao queimar.
          if [ -n "$publicada" ] && [ "$ENSAIO" = "true" ]; then
            echo "A versao $versao ja esta no registro."
            echo "Num lancamento de verdade isto pararia aqui; em ensaio, segue."
            exit 0
          fi

          if [ -n "$publicada" ]; then
            echo "A tag foi criada para a versao $versao, que ja esta publicada no npm."
            echo
            echo "O registro nao aceita republicar o mesmo numero - nem com outro"
            echo "conteudo, nem depois de um unpublish. Publicar de novo exige"
            echo "uma versao nova."
            echo
            echo "O que fazer:"
            echo "  1. suba a versao em native/package.json e registre a mudanca"
            echo "     em native/CHANGELOG.md;"
            echo "  2. apague a tag que sobrou, aqui e no remoto:"
            echo "     git tag -d native-v$versao && git push origin :native-v$versao"
            echo "  3. crie a tag da versao nova, que e quem dispara este workflow."
            echo
            echo "No registro hoje: latest $(npm view @rivocode/ui-native version 2>/dev/null || echo '?')."
            exit 1
          fi

          echo "A versao $versao ainda nao existe no registro."

      # Este pacote publica FONTE - `exports` aponta para ./src/index.ts, e o
      # Metro compila no app de quem usa. Erro de tipo daqui nao fica aqui: ele
      # aparece dentro do node_modules de quem consome, e o skipLibCheck de la
      # nao ajuda, porque so cobre .d.ts. Por isso a passagem de tipos e
      # condicao de publicacao, e nao cortesia.
      - run: bun run check:native:types

      # Os tokens do nativo sao DERIVADOS do CSS do web. Publicar com eles
      # fora de sincronia entrega uma cor que nenhum tema declara.
      - run: bun run check:native

      # A tabela de paridade e lida por quem planeja tela de celular. Publicar
      # com ela desatualizada e mandar usar substituto para peca que ja portou.
      - run: bun run check:paridade

      - run: bun test native/

      # O tarball precisa levar o CLI: `bin` sem o arquivo publicado passa como
      # aviso, e nao como erro, entao a versao sobe quebrada e so descobrimos
      # quando alguem roda o comando. Ja aconteceu aqui uma vez, no outro
      # pacote.
      - name: Conferir o que vai no pacote
        working-directory: native
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const [meta] = require('/tmp/pack.json');
            const files = meta.files.map((file) => file.path);
            const pkg = require('./package.json');

            for (const target of Object.values(pkg.bin ?? {})) {
              const path = target.replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Falta no tarball o bin ' + path);
                process.exit(1);
              }
            }

            // O pacote e a fonte: se o ponto de entrada nao viajar, o app de
            // quem instalar quebra no primeiro import, e nao no build.
            for (const entry of Object.values(pkg.exports)) {
              const path = String(entry).replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Falta no tarball a entrada ' + path);
                process.exit(1);
              }
            }

            console.log('entradas e bin ok:', files.length, 'arquivos');
          "

      # O ensaio, antes da estreia.
      #
      # O passo acima confere a LISTA de arquivos; este exercita o caminho da
      # publicacao inteiro - o mesmo empacotamento, as mesmas regras de
      # `files` e `exports`, o mesmo `--access public` - e para antes do
      # unico passo que nao da para desfazer. Os dois nao sao o mesmo passo:
      # um le o tarball, o outro monta a publicacao.
      #
      # Vale mesmo quando a publicacao vai acontecer logo em seguida: uma
      # quebra de empacotamento aparece aqui, com o publish real ainda por
      # fazer, e nao com metade da versao ja no registro.
      #
      # O `--dry-run` NAO e offline, e essa foi a descoberta que quase custou o
      # ensaio inteiro. Ele monta o tarball e vai ate o registro perguntar se a
      # publicacao seria aceita - e a primeira coisa que o registro responde e
      # que aquele numero ja existe:
      #
      #   npm error You cannot publish over the previously published versions: 0.2.0.
      #
      # Ou seja, o proprio ensaio morreria no penultimo passo, na mesma pedra
      # que derrubou as quatro execucoes anteriores, e pelo mesmo motivo: a
      # unica coisa que falta e um numero novo.
      #
      # Por isso, em ensaio, esta e a UNICA mensagem tolerada. Chegar ate ela
      # prova o que o ensaio veio provar - o empacotamento fechou, o
      # `--access public` foi entendido, o registro atendeu e leu o manifesto -
      # e o que sobra e a recusa que so um numero novo resolve. Qualquer outra
      # falha continua derrubando a corrida, que e o ponto de ter um ensaio.
      #
      # Numa publicacao de verdade a versao e inedita, o comando passa limpo, e
      # nada disto entra em campo.
      - name: Ensaiar a publicacao
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENSAIO: ${{ inputs.ensaio }}
        run: |
          set +e
          saida=$(npm publish --access public --dry-run 2>&1)
          codigo=$?
          echo "$saida"

          if [ $codigo -eq 0 ]; then
            exit 0
          fi

          if [ "$ENSAIO" = "true" ] &&
             echo "$saida" | grep -q "cannot publish over the previously published versions"; then
            echo
            echo "O registro so recusou o NUMERO: tudo antes disso passou."
            echo "Num lancamento de verdade a versao seria inedita e o comando fecharia limpo."
            exit 0
          fi

          exit $codigo

      # A unica linha que o ensaio nao atravessa. Tudo acima ja rodou igual.
      - name: Publicar
        if: ${{ inputs.ensaio != true }}
        working-directory: native
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Um ensaio que termina em verde parece uma publicacao que terminou em
      # verde: mesmo cheque, mesma cor, mesma duracao. Quem abrir a lista de
      # execucoes amanha precisa conseguir separar os dois sem entrar passo a
      # passo - e, principalmente, nao pode sair daqui achando que a versao
      # subiu. Por isso o recado vai tambem para o resumo da execucao, que e a
      # primeira coisa que a pagina mostra.
      - name: Dizer que foi ensaio
        if: ${{ inputs.ensaio == true }}
        # Pelo mesmo motivo do passo que consulta a versao: o .npmrc escrito
        # pelo setup-node espera esta variavel, e sem ela o `npm view` reclama
        # de autenticacao em vez de responder o que se perguntou.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          versao=$(node -p "require('./native/package.json').version")
          {
            echo "## Ensaio - NADA foi publicado"
            echo
            echo "O caminho inteiro rodou sobre a versao \`$versao\`: install,"
            echo "tipos, tokens, paridade, suite, empacotamento e"
            echo "\`npm publish --dry-run\`. O unico passo pulado foi o"
            echo "\`npm publish\` real."
            echo
            echo "No registro continua: latest \`$(npm view @rivocode/ui-native version 2>/dev/null || echo '?')\`."
            echo
            echo "Para publicar de verdade, crie a tag \`native-v<versao>\` -"
            echo "e o gatilho de tag faz o resto."
          } | tee -a "$GITHUB_STEP_SUMMARY"
