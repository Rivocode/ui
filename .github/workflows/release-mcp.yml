name: release-mcp

# Publishes @rivocode/ui-mcp when an `mcp-v*` tag goes up.
#
# Third package, third workflow, on the release-native mold: the MCP server
# moves at its own speed. It packs the DS documentation from the tree it was
# built in, so a web release does not force a release here, and a new server
# (new tool, better search) does not force a web release.
#
# The tag prefix is what separates the triggers: `v0.15.0` is web's,
# `native-v0.10.0` native's and `mcp-v0.1.0` this one's. None of the three
# matches the pattern of the other two.
on:
  push:
    tags: ["mcp-v*"]
  # Repeat a publication that failed halfway without creating another tag, and,
  # with `dry_run`, go through the whole path without spending any version.
  # `tag.yml` also calls in through here, because a tag pushed with the
  # GITHUB_TOKEN does not fire `on: push: tags`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, such as mcp-v0.1.0. Empty only in a dry run."
        required: false
      dry_run:
        # The first publication of a new package is the blindest flight of all:
        # release-native died four times on the last step before anyone could
        # exercise the whole path. The dry run runs everything, in the same
        # order and with the same secrets, and skips only the real `npm publish`.
        description: "Dry run: runs the whole path and does NOT publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token` and `--provenance` go TOGETHER: one without the other does
      # not publish signed, and the gap only shows on the last command of a
      # publication that cannot be undone. The repository is public, so the
      # registry accepts provenance from this package's first version.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is here for `npm publish` - which authenticates through trusted
      # publishing, with no .npmrc nor secret - and for the smoke test, which
      # runs the bin with `node`, the way the installer's `npx` will run it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # `mcp/` is a workspace of the root: a single install brings the MCP SDK
      # for the package and for the test that starts the server in memory.
      - run: bun install --frozen-lockfile

      # Trusted publishing (OIDC): npm trusts this workflow, from this
      # repository, and no token is stored. It requires npm 11.5.1 or newer,
      # and the npm that ships with Node may be older. Without it, `npm publish`
      # falls back to the token that no longer exists and dies with ENEEDAUTH
      # after check and build have already spent the run.
      - name: Check the npm for trusted publishing
        run: |
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm $version"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$version"; then
            echo "::error::Trusted publishing requires npm 11.5.1 or newer, and this one is $version."
            exit 1
          fi

      - name: Check the provenance token
        # npm's `--dry-run` does NOT exercise provenance: there is an
        # `if (!dryRun)` before the signature is generated, so the dry run goes
        # green without proving anything. This variable only exists when
        # `id-token: write` was granted to the job, and it is the only part of
        # provenance the dry run catches.
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token: the job needs `id-token: write` in permissions."
            exit 1
          fi
          echo "OIDC token present: the publication goes out signed."

      # The tag and the mcp/package.json version have to tell the same story:
      # `mcp-v0.2.0` over a manifest at 0.1.0 would republish the old version.
      # In a dry run the check reports and does not stop, because the dry run
      # usually runs straight from main, where there is no tag to match.
      - name: Check the tag and the version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          pkg="mcp-v$(node -p "require('./mcp/package.json').version")"

          if [ "$DRY_RUN" = "true" ]; then
            if [ -z "$TAG" ]; then
              echo "Dry run from ${{ github.ref_name }}, over $pkg."
            elif [ "$TAG" != "$pkg" ]; then
              echo "Warning: tag $TAG does not match mcp/package.json ($pkg)."
              echo "In a real publication this would stop here."
            else
              echo "Dry run over $pkg."
            fi
            exit 0
          fi

          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "A real publication requires the tag in the form."
            echo "To just exercise the path, check the \"Dry run\" box."
            exit 1
          fi

          tag="${TAG:-${{ github.ref_name }}}"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match the mcp/package.json version ($pkg)."
            exit 1
          fi
          echo "Publishing $pkg"

      # The version may already be in the registry, and npm only says so at the
      # end, with a `403` that talks about permission and does not say what to do.
      - name: Check whether the version is already published
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(node -p "require('./mcp/package.json').version")

          # `npm view` answers 404 for a missing version AND for a missing
          # package, and both mean "go ahead and publish". That matters more
          # here than in the other two workflows: on the first publication the
          # @rivocode/ui-mcp package does not exist in the registry yet, and
          # this guard has to be crossed.
          published=$(npm view "@rivocode/ui-mcp@$version" version 2>/dev/null || true)

          # In a dry run the guard reports and goes on: the dry run exists
          # precisely to spend the whole run without burning a new number.
          if [ -n "$published" ] && [ "$DRY_RUN" = "true" ]; then
            echo "Version $version is already in the registry."
            echo "In a real release this would stop here; in a dry run, it goes on."
            exit 0
          fi

          if [ -n "$published" ]; then
            echo "The tag was created for version $version, which is already published on npm."
            echo
            echo "The registry does not accept republishing the same number. What to do:"
            echo "  1. bump the version in mcp/package.json and record the change"
            echo "     in mcp/CHANGELOG.md;"
            echo "  2. delete the leftover tag, here and on the remote:"
            echo "     git tag -d mcp-v$version && git push origin :mcp-v$version"
            echo "  3. create the tag for the new version, which is what triggers this workflow."
            echo
            echo "In the registry today: latest $(npm view @rivocode/ui-mcp version 2>/dev/null || echo '?')."
            exit 1
          fi

          echo "Version $version does not exist in the registry yet."

      # The whole gate, not a piece of it: the server's content is the DS
      # documentation, and `check` is what holds that documentation against the
      # code - props, parity, signature, doc examples.
      - run: bun run check

      # Only this package. `content.json` is written again in this step, from
      # the tree the tag froze, and it is what the tarball carries.
      - run: bun run build:mcp

      # The built server, over stdio, with `node`: the same command the
      # installer's MCP client will run.
      - run: bun run smoke:mcp

      # A `bin` without the published file passes as a warning, not an error,
      # and a `content.json` left out of the tarball would leave the server
      # with nothing to serve.
      - name: Check what goes into the package
        working-directory: mcp
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const pack = require('/tmp/pack.json');
            const meta = Array.isArray(pack) ? pack[0] : Object.values(pack)[0];
            const files = meta.files.map((file) => file.path);
            const pkg = require('./package.json');

            const wanted = [...Object.values(pkg.bin ?? {}), 'dist/content.json', 'README.md', 'CHANGELOG.md', 'LICENSE'];
            for (const target of wanted) {
              const path = target.replace(/^\.\//, '');
              if (!files.includes(path)) {
                console.error('Missing from the tarball: ' + path);
                process.exit(1);
              }
            }

            console.log('bin, content and documents ok:', files.length, 'files');
          "

      # The whole publishing path, stopping before the only step that cannot be
      # undone. `--dry-run` is NOT offline: it asks the registry, and in a dry
      # run over an already published version the refusal of the NUMBER is the
      # only one tolerated.
      - name: Rehearse the publication
        working-directory: mcp
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          output=$(npm publish --access public --provenance --dry-run 2>&1)
          code=$?
          echo "$output"

          if [ $code -eq 0 ]; then
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ] &&
             echo "$output" | grep -q "cannot publish over the previously published versions"; then
            echo
            echo "The registry only refused the NUMBER: everything before it passed."
            exit 0
          fi

          exit $code

      - name: Publish
        if: ${{ inputs.dry_run != true }}
        working-directory: mcp
        run: npm publish --access public --provenance

      # A green dry run looks like a green publication. The note goes to the
      # run summary, which is the first thing the page shows.
      - name: Say it was a dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          {
            echo "## Dry run - NOTHING was published"
            echo
            echo "The whole path ran over version \`$version\`: install,"
            echo "check, package build, stdio smoke test, packaging and"
            echo "\`npm publish --dry-run\`. The only step skipped was the"
            echo "real \`npm publish\`."
            echo
            echo "Still in the registry: latest \`$(npm view @rivocode/ui-mcp version 2>/dev/null || echo 'none')\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"
