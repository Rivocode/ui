name: docs

# Publishes ds.rivocode.com.br on every push to main.
#
# Vercel builds on its own when it reads the repository itself - and that is
# where the Hobby plan blocks: a private organization repository requires Pro.
# This workflow takes the repository out of the account: the site is built HERE
# and uploaded ready, so Vercel never looks at the code nor at who owns it. It
# is the path Vercel's own documentation points to when the Git integration is
# not available.
#
# What does not change: the project, the domain and vercel.json. `vercel build`
# reads the same file and produces the same rules - the rewrite that makes
# navigation work and, above all, the headers that serve `.md` as markdown and
# `llms.txt` as text. Without them the browser downloads the file instead of
# showing it, and an agent gets HTML where it expected markdown.
on:
  push:
    branches: [main]
  # To republish without a new commit - when only the secret or the domain changes.
  workflow_dispatch:

# One publication at a time: two pushes in a row on main would fight over the
# same domain, and whichever finished last would win, even if it was the older.
concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The Vercel CLI runs on Node, and the site build runs on bun. Both have
      # to exist: `vercel build` calls the `buildCommand` from vercel.json,
      # which is `cd apps/docs && bun run build`.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The three secrets are checked BEFORE the install, and checked for
      # real: existing is not enough.
      #
      # The CLI reads the token from the environment variable, which is the
      # recommended path in CI - on the command line it would show up in the
      # process list and in the log. And an empty `--token` does not fail as a
      # missing secret: it fails with "you defined --token, but without a
      # value", which sends you looking in the wrong place. Here the message
      # says what it is.
      #
      # The cleanup is not fussiness: a secret pasted with quotes around it, or
      # with the line break the browser carries along, arrives here as part of
      # the value. `prj_x` becomes `"prj_x"`, Vercel finds no project and
      # answers the same thing it would answer to a token without access.
      - name: Check the Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"

          if [ -n "$missing" ]; then
            echo "Arrived empty:$missing"
            echo
            echo "In Settings > Secrets and variables > Actions, as a REPOSITORY secret:"
            echo "  VERCEL_TOKEN       vercel.com/account/tokens"
            echo "  VERCEL_ORG_ID      the orgId field of the local .vercel/project.json"
            echo "  VERCEL_PROJECT_ID  the projectId field of the same file"
            echo
            echo "The .vercel/ folder is not versioned on purpose: it is a local account,"
            echo "not project configuration. That is why both ids come as secrets."
            exit 1
          fi

          clean() { printf '%s' "$1" | tr -d "[:space:]\"'"; }

          token=$(clean "$VERCEL_TOKEN")
          org=$(clean "$VERCEL_ORG_ID")
          project=$(clean "$VERCEL_PROJECT_ID")

          # The cleaned value is new to Actions, which only masks what came from
          # the vault. Without this, a quoted secret would show up readable in the log.
          echo "::add-mask::$token"

          {
            echo "VERCEL_TOKEN=$token"
            echo "VERCEL_ORG_ID=$org"
            echo "VERCEL_PROJECT_ID=$project"
          } >> "$GITHUB_ENV"

          echo "All three secrets are in place."
          case "$org" in team_*) ;; *) echo "Warning: VERCEL_ORG_ID does not start with team_, so the project would belong to a personal account." ;; esac
          case "$project" in prj_*) ;; *) echo "Warning: VERCEL_PROJECT_ID does not start with prj_." ;; esac

      # The question `vercel pull` does not answer.
      #
      # It fails with "Could not retrieve Project Settings" for three different
      # causes - token refused, token without access to the team, ids of another
      # project - and on top of that tells you to delete a `.vercel/` that does
      # not even exist on the runner. Several publications were lost on that
      # message. The API answers the three separately, so it is the API that
      # tells what happened, before spending the install and the build.
      - name: Check the token's access
        run: |
          fail() { echo; echo "$@"; }

          account=$(curl -sS -o /tmp/account.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user) || account=000

          # The CLI loads the token's owner before any command, and stops with
          # "Not able to load user ... User not found" when there is no owner.
          # Not every token the API accepts has one: integration tokens and
          # tokens bound to a team answer for the team's resources and answer
          # for no person. They pass everything you ask through the API and are
          # useless for publishing - that is how this workflow was born broken,
          # with an error that talked about permission.
          owner="yes"
          if [ "$account" = "200" ]; then
            echo "Token of account $(jq -r '.user.username // .user.email // "?"' /tmp/account.json)."
          elif [ "$(jq -r '.error.code // ""' /tmp/account.json)" = "forbidden" ]; then
            fail "Vercel refused the token (HTTP $account): $(jq -r '.error.message // "?"' /tmp/account.json)"
            echo "It expired or was revoked. Generate another at vercel.com/account/tokens."
            exit 1
          else
            owner="no"
          fi

          target=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID") || target=000

          if [ "$target" = "200" ]; then
            echo "The token sees project $(jq -r '.name' /tmp/project.json) inside $VERCEL_ORG_ID."

            if [ "$owner" = "no" ]; then
              fail "...and even so it is useless: it has no owner (HTTP $account on /v2/user)."
              echo "The CLI refuses before looking at the project, with \"User not found\"."
              echo
              echo "What fixes it: at vercel.com/account/tokens, logged in as the person,"
              echo "create a token SCOPED to the team that owns the project and save it"
              echo "again as VERCEL_TOKEN. An integration token, or one bound to the team"
              echo "with no person behind it, gets this far intact and dies on the first command."
              exit 1
            fi

            # The team's slug, for the CLI.
            #
            # The check above carries the teamId; the CLI, without `--scope`,
            # resolves the project through the logged-in user's default team,
            # which is not necessarily this one. With the scope written out,
            # the three commands talk about the same project just checked.
            slug=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID" | jq -r '.slug // empty')
            # Without the slug, the id itself works as the scope.
            echo "VERCEL_SCOPE=${slug:-$VERCEL_ORG_ID}" >> "$GITHUB_ENV"
            echo "CLI scope: ${slug:-$VERCEL_ORG_ID}"
            exit 0
          fi

          fail "The token does not reach the project (HTTP $target): $(jq -r '.error.code // "?"' /tmp/project.json)"
          echo "Response: $(jq -c '.error // .' /tmp/project.json)"
          echo "Looked for: project $VERCEL_PROJECT_ID in team $VERCEL_ORG_ID."
          echo
          echo "What this token reaches today:"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/teams \
            | jq -r '.teams[]? | "  team     \(.id)  \(.slug)"'
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=20&teamId=$VERCEL_ORG_ID" \
            | jq -r '.projects[]? | "  project  \(.id)  \(.name)"'
          echo
          echo "If the team list comes out empty, the token belongs to a personal account:"
          echo "redo it with the team in scope. If the team shows up but the project does"
          echo "not, VERCEL_PROJECT_ID belongs to another project - the right value is the"
          echo "projectId from .vercel/project.json."
          exit 1

      - run: bun install --frozen-lockfile

      # `.vercel/` is not versioned - it is a local account, not project
      # configuration -, so on the runner it does not exist. And `vercel build`
      # does not manage with just the two ids in the environment: it looks for
      # the project settings on disk and stops with "No Project Settings found
      # locally". This step is what writes `.vercel/` here, from the ids, and
      # Vercel's own documentation asks for it to come before the build.
      - name: Fetch the project settings
        run: npx vercel@latest pull --yes --environment=production --scope "$VERCEL_SCOPE"

      - name: Build
        run: npx vercel@latest build --prod --scope "$VERCEL_SCOPE"

      # The check the Vercel integration never did: the site exists to be read
      # by agents, and the index is the door. If the build comes out without
      # `llms.txt` or without the raw pages, it goes up pretty and useless - and
      # the symptom only shows when someone asks an agent for the wrong piece.
      - name: Check what goes live
        run: |
          out=.vercel/output/static
          for file in "$out/llms.txt" "$out/index.html" "$out/componentes/button.md"; do
            if [ ! -f "$file" ]; then
              echo "Missing from the build: $file"
              exit 1
            fi
          done
          pages=$(find "$out/componentes" -name '*.md' | wc -l)
          echo "$pages raw pages, llms.txt and index in place"
          if [ "$pages" -lt 100 ]; then
            echo "Too few pages: the catalog has more than a hundred."
            exit 1
          fi

      - name: Publish
        run: npx vercel@latest deploy --prebuilt --prod --scope "$VERCEL_SCOPE"
