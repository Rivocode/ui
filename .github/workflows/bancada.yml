name: bancada

# The accessibility bench and the showcase portraits, in CI.
#
# Both measure against an absolute reference that does not hold on ubuntu: the
# committed signatures were born on macOS, and `bun run a11y` flags today what
# the pieces already have. Measured on 24/09/2026 in an ubuntu 24.04 container
# with google-chrome 154: the main tree, with no change at all, came out with
# 23 of the 50 portraits different from the committed ones just from font and
# antialiasing - the twelve section frames among them, with the worst square
# off by 13 to 31 gray levels.
#
# So the bench compares the BASE with the HEAD, both measured on this same
# runner, with the same Chrome and the same fonts. The platform cancels out;
# what is left is the commit. The whole why, and the alternatives that lost,
# is in the header of `scripts/bench-comparison.ts`.
#
# Its own workflow, and not a job in `ci.yml`, on purpose: `tag.yml` listens
# to `ci`, and a browser bench that is slow or stumbles must not hold back a
# publication the gate already approved.
on:
  pull_request:
    # `labeled` and `unlabeled` because the `retrato-aceito` label changes the
    # verdict, and without these types it would only count on the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: bancada-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bancada:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The ubuntu runner already ships google-chrome. Ubuntu 24.04 restricts
      # unprivileged user namespaces, and without `--no-sandbox` Chrome does
      # not open - the page opened is our own showcase, served on 127.0.0.1.
      RC_CHROME: /usr/bin/google-chrome
      RC_CHROME_FLAGS: --no-sandbox
      # On a PR, the base is the tip of main when the PR was updated. On a
      # push, it is what main was before it.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'retrato-aceito') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base is mounted as a worktree, and has to be in the history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Runner Chrome
        run: |
          "$RC_CHROME" --version
          mkdir -p "$RUNNER_TEMP/measure/base" "$RUNNER_TEMP/measure/head"

      # The base lives OUTSIDE the repository folder: the showcase Tailwind
      # scans the tree from there, and a second copy of `src/` inside it would
      # generate classes the head does not have.
      - name: Mount the base
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      # The measuring scripts are ALWAYS the head's, run over each tree: the
      # base may predate `--json` and `--record-to`, and measuring the two
      # sides with different rulers would be comparing the rulers.
      - name: Measure the base
        working-directory: ${{ runner.temp }}/base
        run: |
          bun install --frozen-lockfile
          bun run demo
          bun run "$GITHUB_WORKSPACE/scripts/shot.ts"
          bun run "$GITHUB_WORKSPACE/scripts/visual-regression.ts" --record-to "$RUNNER_TEMP/measure/base/portraits.json"
          bun run "$GITHUB_WORKSPACE/scripts/accessibility.ts" --json "$RUNNER_TEMP/measure/base/accessibility.json"
          cp demo/assinaturas.json "$RUNNER_TEMP/measure/base/assinaturas.json"

      - name: Measure the head
        run: |
          bun run demo
          bun run scripts/shot.ts
          bun run scripts/visual-regression.ts --record-to "$RUNNER_TEMP/measure/head/portraits.json"
          bun run scripts/accessibility.ts --json "$RUNNER_TEMP/measure/head/accessibility.json"
          cp demo/assinaturas.json "$RUNNER_TEMP/measure/head/assinaturas.json"

      - name: Compare
        run: |
          flags=()
          if [ "$ACCEPTED" = "true" ]; then flags+=(--portrait-accepted); fi
          bun run scripts/bench-comparison.ts \
            --base "$RUNNER_TEMP/measure/base" \
            --head "$RUNNER_TEMP/measure/head" \
            "${flags[@]}"

      # A portrait that changed is looked at, not read as a number: the PNGs of
      # both sides are uploaded when the bench goes red.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portraits
          path: |
            demo/dist/*.png
            ${{ runner.temp }}/base/demo/dist/*.png
            ${{ runner.temp }}/measure
          retention-days: 7
