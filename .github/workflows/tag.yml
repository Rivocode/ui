name: tag

# Creates the tag when a manifest's version changes on `main`, and calls the release.
#
# Before this, the tag was a person's action. The owner decided to automate it,
# aware of what was being traded: it was the human finger on `git tag` that
# guaranteed a merge of half-done work would publish nothing. The four guards
# below exist to give that guarantee back by machine - especially the CHANGELOG
# one, which is what separates "the version went up" from "the version is ready".
#
# The trigger is the `ci` `workflow_run`, and not `push`. The difference
# matters: this way no tag is born before the whole gate has passed over that
# commit. An `on: push` would run in parallel with `ci` and could tag code the
# gate is still going to reject - and an npm publication cannot be undone.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # The dry run, for the same reason as the release workflows: this path only
  # really runs on a release day, and there is no way to exercise it without
  # spending a version. With the box checked, everything runs the same -
  # decision, guards and summary - and the tag is NOT born.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: decides and reports, and creates NO tag"
        type: boolean
        default: true

jobs:
  decide:
    # `workflow_run` fires on any conclusion, including `failure` and
    # `cancelled`. Without this line, a red gate would become a tag.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      # Create and push the tag.
      contents: write
      # Call the release through `workflow_dispatch`. Without this, `gh workflow
      # run` returns 403, and the tag would stay in the history pointing to a
      # version that never went up - exactly the state the release workflows
      # spend a whole step to avoid.
      actions: write

    strategy:
      # One package does not decide for another: they move at different
      # speeds, and a stalled web package must not silence native or mcp.
      fail-fast: false
      # In series, not in parallel: the three legs push tags to the same
      # `origin`, and two ref updates at once yield nothing but a race to
      # debug later.
      max-parallel: 1
      matrix:
        # Each package's table - manifest, prefix, CHANGELOG and workflow -
        # lives in `TARGETS`, inside `scripts/release-decision.ts`, so it does
        # not exist in two places. Only the key stays here.
        package: [web, native, mcp]

    steps:
      # The commit `ci` approved, and not the tip of `main` right now. In a
      # `workflow_run`, `GITHUB_SHA` points to the tip of the default branch,
      # which may have moved already: tagging it would be tagging code nobody
      # measured.
      #
      # `fetch-depth: 0` brings the history and the tags. The tags are also
      # read from `origin` through `git ls-remote`, which is the authoritative
      # answer, but a shallow clone would leave `git tag --list` empty and the
      # local read would lie.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is here only for `npm view`: it answers whether the number is
      # already in the registry, and that is the only one of the four guards
      # that needs the network.
      #
      # No `registry-url` on purpose, as in the releases. It is what writes the
      # `.npmrc` that expects `NODE_AUTH_TOKEN`, and querying the registry
      # needs no credential: without the file, there is no empty token for npm
      # to read and complain about authentication instead of answering the
      # question. This workflow publishes nothing, so it does not see the secret.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The decision lives in a pure function, not here: `decideRelease`
      # receives the version, the existing tags, the registry versions, the
      # CHANGELOG text and the commit message, and returns the verdict with the
      # reason. `test/release-decision.test.ts` covers the four reasons to block
      # and the happy path, for the three packages - which could not be proven
      # if the decision were a shell `if` written in this file.
      #
      # This step does NOT fail when a guard blocks. A guard that turns CI red
      # on every push that is not a release gets turned off in the second week,
      # and then the release it protected stops being protected. It reports in
      # the run summary and moves on.
      #
      # No `bun install` before it: the script imports nothing from
      # `node_modules`, and installing the whole tree to read two manifests
      # would cost more than everything this workflow does.
      - name: Decide
        id: decide
        run: bun run scripts/release-decision.ts ${{ matrix.package }}

      # The tag points to the commit `ci` approved, which is what is at HEAD
      # after the checkout above.
      - name: Create the tag
        if: ${{ steps.decide.outputs.release == 'true' && inputs.dry_run != true }}
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # The trap that decides the design of this file.
      #
      # A tag pushed with the default `GITHUB_TOKEN` does NOT fire
      # `on: push: tags`. GitHub blocks it on purpose, to avoid recursion:
      # "events triggered by the GITHUB_TOKEN will not create a new workflow
      # run". If this workflow only created the tag, `release.yml` would never
      # wake up, and all that would be left is a tag in the history with no
      # version on npm.
      #
      # `workflow_dispatch` is one of the exceptions written into that same
      # rule - it fires even when coming from the `GITHUB_TOKEN`. That is why
      # the call is explicit, and why the job asks for `actions: write`. The
      # three releases accept the `tag` field, and it is what ties the
      # publication to the freshly created tag instead of the tip of `main`.
      #
      # `--ref` points to the tag so that the version of the workflow that runs
      # is the one the tag froze. The tag just went up, and `gh` sometimes
      # arrives before the ref is visible to the API: hence the attempts.
      - name: Call the release
        if: ${{ steps.decide.outputs.release == 'true' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          WORKFLOW: ${{ steps.decide.outputs.workflow }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run "$WORKFLOW" --ref "$TAG" --field tag="$TAG"; then
              echo "$WORKFLOW was called for $TAG."
              exit 0
            fi
            echo "Attempt $attempt failed; the tag may not be visible yet."
            sleep 5
          done

          echo "::error::Tag $TAG went up and $WORKFLOW did not answer."
          echo "The tag exists and the version was NOT published. Call the release by hand:"
          echo "  gh workflow run $WORKFLOW --ref $TAG --field tag=$TAG"
          exit 1

      # A green dry run looks like a green publication. The note goes to the
      # run summary, which is the first thing the page shows, next to what the
      # decision wrote there.
      - name: Say it was a dry run
        if: ${{ inputs.dry_run == true }}
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          VERDICT: ${{ steps.decide.outputs.verdict }}
        run: |
          {
            echo "Dry run - NO tag was created and nothing was published."
            echo
            echo "The decision above ran in full over the current tree, with the"
            echo "four guards really measured. The verdict was \`$VERDICT\`,"
            echo "and the tag in question would be \`$TAG\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"
