name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # The same `check` that runs on the machine and that publishing requires.
      # Before this, lint, colors, contrast and tests ran as loose steps, and
      # types, previews and the two documentation guards were missing: main
      # could stay green with a broken type, and the error only showed up at
      # publish time.
      - run: bun run check

      # The build is not part of `check`, and it is where what only breaks on
      # packaging shows up: a missing entry, CSS that does not compile, a skill
      # that was not copied.
      - run: bun run build

      # The built MCP server, run with `node` over stdio the way an installer's
      # client runs it. The in-memory test in `check` does not see a bin
      # without a shebang nor a `content.json` that was never written.
      - run: bun run smoke:mcp

  # The native package publishes SOURCE, so a type error in it lands in the
  # consumer's build - and the consumer's skipLibCheck does not help, because it
  # only covers .d.ts. The check lives in its own job because react and
  # react-native are peers: the only place they are installed is the example
  # app, which is not a workspace. That is why it cannot go into
  # `bun run check`, which has to run on a clean clone - and why it has to run
  # here, or it runs nowhere.
  nativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: examples/native

      - run: bun run check:native:types

      # The native props table is a committed artifact, and this is the only
      # job that can GENERATE it: `--check` compares the JSON with what the
      # compiler says now. Without it, the gate's `check:signature` would check
      # the signature against an old snapshot of the native package.
      - run: bun run check:props:native
